name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Install R Packages and Surveyjoin
        run: |
          install.packages("pak", repos = "https://r-lib.github.io/p/pak/dev/")
          # Install CRAN dependencies first for speed
          pak::pkg_install(c("shiny", "leaflet", "rerddap", "sf", "dplyr", "viridis"))
          # Install the specific DFO-NOAA package
          pak::pkg_install("DFO-NOAA-Pacific/surveyjoin")
        shell: Rscript {0}
